version: 2

project_name: viyactl

before:
  hooks:
    # https://goreleaser.com/customization/hooks/#complex-commands
    - sh -c 'date -R > ./cmd/datetime.txt'
    - sh -c 'echo "At commit $(git rev-parse HEAD)" >> ./cmd/datetime.txt'
    - go mod tidy
    - govulncheck ./...
    - golangci-lint run

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - windows
      - darwin

checksum:
  name_template: "checksums.txt"

sboms:
  - id: cyclonedx
    artifacts: archive
    args: ["$artifact", "--output", "cyclonedx-json=$document"]
    documents:
      - "${artifact}.spdx.json"

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
